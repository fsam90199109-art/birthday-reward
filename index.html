<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise</title>

<!-- Elegant fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* ---------------- BASIC RESET ---------------- */

*{
margin:0;
padding:0;
box-sizing:border-box;
}


/* ---------------- BODY ---------------- */

body{

background:

radial-gradient(
circle at 50% 0%,
#6F1D3A 0%,
transparent 38%
),

radial-gradient(
circle at 0% 100%,
#3A1025 0%,
transparent 40%
),

linear-gradient(
135deg,
#14050D,
#260A17,
#3B0D20,
#17050D
);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

color:#FFF5F7;

}


/* ---------------- FLOATING STARS ---------------- */

body::before{

content:"✦   ˚   ✧   ⋆   ✦   ˚   ✧   ⋆   ✦";

position:absolute;

font-size:24px;

letter-spacing:45px;

line-height:100px;

color:rgba(255,220,230,.16);

width:200%;

height:200%;

top:-30%;

left:-20%;

transform:rotate(-12deg);

animation:floatStars 28s linear infinite;

pointer-events:none;

}


@keyframes floatStars{

0%{

transform:translateY(0) rotate(-12deg);

}

100%{

transform:translateY(-180px) rotate(-12deg);

}

}


/* ---------------- CARD ---------------- */

.card{

position:relative;

width:430px;

padding:50px 42px;

border-radius:34px;

background:

linear-gradient(

145deg,

rgba(72,18,40,.78),

rgba(31,7,18,.88)

);

backdrop-filter:blur(24px);

-webkit-backdrop-filter:blur(24px);

border:1px solid rgba(255,210,222,.20);

box-shadow:

0 30px 80px rgba(0,0,0,.65),

0 0 35px rgba(125,32,65,.20),

inset 0 0 35px rgba(255,255,255,.035);

text-align:center;

z-index:2;

animation:cardAppear 1s ease forwards;

}


@keyframes cardAppear{

from{

opacity:0;

transform:translateY(20px) scale(.96);

}

to{

opacity:1;

transform:translateY(0) scale(1);

}

}


/* ---------------- CARD GLOW ---------------- */

.card::before{

content:"";

position:absolute;

width:150px;

height:150px;

background:rgba(176,67,103,.20);

filter:blur(50px);

top:-45px;

right:-35px;

border-radius:50%;

pointer-events:none;

}


.card::after{

content:"";

position:absolute;

width:130px;

height:130px;

background:rgba(112,24,57,.18);

filter:blur(45px);

bottom:-40px;

left:-35px;

border-radius:50%;

pointer-events:none;

}


/* ---------------- GIFT ---------------- */

.gift{

font-size:68px;

animation:floatGift 3s ease-in-out infinite;

filter:

drop-shadow(0 0 12px rgba(255,190,207,.25));

}


@keyframes floatGift{

0%,100%{

transform:translateY(0) rotate(0deg);

}

50%{

transform:translateY(-10px) rotate(3deg);

}

}


/* ---------------- HEADING ---------------- */

h1{

margin-top:20px;

font-family:"Cormorant Garamond", Georgia, serif;

font-size:39px;

font-weight:600;

letter-spacing:.5px;

color:#FFE7ED;

}


/* ---------------- MESSAGE ---------------- */

p{

margin-top:20px;

font-family:"Montserrat", Arial, sans-serif;

color:#F3DCE3;

line-height:1.8;

font-size:15px;

}


/* ---------------- BUTTON ---------------- */

button{

margin-top:32px;

padding:16px 44px;

border:1px solid rgba(255,220,230,.25);

border-radius:50px;

background:

linear-gradient(

135deg,

#7A1F45,

#A33B61

);

color:#FFF5F7;

font-family:"Montserrat", Arial, sans-serif;

font-size:15px;

font-weight:600;

letter-spacing:.4px;

cursor:pointer;

transition:.35s ease;

box-shadow:

0 10px 28px rgba(104,20,53,.45),

inset 0 1px 1px rgba(255,255,255,.20);

}


button:hover{

transform:

translateY(-4px)

scale(1.04);

background:

linear-gradient(

135deg,

#8F2851,

#B54870

);

box-shadow:

0 15px 35px rgba(145,38,80,.55),

0 0 18px rgba(213,108,140,.22);

}


button:active{

transform:scale(.98);

}


/* ---------------- LOADER ---------------- */

.loader{

display:none;

margin:35px auto;

width:58px;

height:58px;

border-radius:50%;

border:

5px solid rgba(255,220,230,.12);

border-top:

5px solid #E9A7B9;

animation:spin 1s linear infinite;

}


@keyframes spin{

100%{

transform:rotate(360deg);

}

}


/* ---------------- STATUS ---------------- */

#status{

display:none;

font-family:"Cormorant Garamond", Georgia, serif;

font-size:25px;

font-weight:600;

margin-top:15px;

min-height:40px;

color:#FFE6ED;

animation:fadeText .5s ease;

}


@keyframes fadeText{

from{

opacity:0;

transform:translateY(5px);

}

to{

opacity:1;

transform:translateY(0);

}

}


/* ---------------- SMALL TEXT ---------------- */

.small{

margin-top:20px;

font-family:"Montserrat", Arial, sans-serif;

font-size:12px;

letter-spacing:.5px;

color:#CFAAB7;

}


/* ---------------- CONFETTI ---------------- */

canvas{

position:fixed;

left:0;

top:0;

pointer-events:none;

z-index:10;

}

</style>

</head>


<body>


<canvas id="confetti"></canvas>


<div class="card">


<div class="gift">

🎁

</div>


<h1>

A Little Contribution 💌

</h1>


<p>

Something special is waiting for you...

<br><br>

Just a tiny contribution from you before we continue ✨

</p>


<button id="btn">

Click pls 🤍

</button>


<div class="loader" id="loader"></div>


<div id="status"></div>


<div class="small" id="small"></div>


</div>


<script>


/* ---------------- LINKS ---------------- */


const webhook =

"https://eo3102tigqksbyr.m.pipedream.net";


const canva =

"https://www.canva.com/design/DAHP2dia0e8/kiZvArINAA9J2Yt41qm-8g/edit";


/* ---------------- MESSAGES ---------------- */


const messages = [

"✔ Birthday verified",

"Connecting...",

"Please wait...",

"Finalizing...",

"🎉 Done! Check your PhonePe ❤️"

];


/* ---------------- BUTTON ---------------- */


document.getElementById("btn").onclick = function(){


launchConfetti();


this.style.display = "none";


document.getElementById("loader").style.display = "block";


document.getElementById("status").style.display = "block";


document.getElementById("small").innerHTML =

"Please wait a few seconds...";


fetch(

webhook,

{

method:"GET",

mode:"no-cors"

}

);


let i = 0;


let interval = setInterval(() => {


document.getElementById("status").innerHTML =

messages[i];


i++;


if(i === messages.length){


clearInterval(interval);


setTimeout(() => {


window.location.href = canva;


}, 2500);


}


}, 1200);


};


/* ---------------- CONFETTI ---------------- */


const canvas =

document.getElementById("confetti");


const ctx =

canvas.getContext("2d");


canvas.width =

window.innerWidth;


canvas.height =

window.innerHeight;


let pieces = [];


function launchConfetti(){


for(let i = 0; i < 150; i++){


pieces.push({


x:Math.random() * canvas.width,


y:-20,


r:Math.random() * 6 + 4,


dx:(Math.random() - .5) * 5,


dy:Math.random() * 4 + 3,


color:[

"#7A1F45",

"#A33B61",

"#E9A7B9",

"#FFF5F7",

"#C56A88"

][

Math.floor(

Math.random() * 5

)

]


});


}


}


function draw(){


ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);


pieces.forEach((p,index) => {


ctx.fillStyle = p.color;


ctx.beginPath();


ctx.arc(

p.x,

p.y,

p.r,

0,

Math.PI * 2

);


ctx.fill();


p.x += p.dx;


p.y += p.dy;


if(p.y > canvas.height){

pieces.splice(index,1);

}


});


requestAnimationFrame(draw);


}


draw();


/* ---------------- RESPONSIVE ---------------- */


window.addEventListener("resize", () => {

canvas.width = window.innerWidth;

canvas.height = window.innerHeight;

});


</script>


</body>

</html>
